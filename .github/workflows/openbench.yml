name: OpenBench

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.simd }} ${{ matrix.bitops }} private artifacts
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64-bmi2
            simd: avx2
            bitops: pext
          - arch: x86-64-avx2
            simd: avx2
            bitops: popcnt
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Fetch the pinned Horde opening book
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import urllib.request
          import zipfile

          url = "https://raw.githubusercontent.com/Belzedar94/OpenBench/cd0560081f6433b58a8aa8d0c3fd4a91e969f1dd/Books/HORDE_openings.epd.zip"
          archive_sha = "556b8bd549dc22797238268f9737c6a1f074a82f4cae2f4d62005ffbac6ccd18"
          payload_sha = "93e97b27d5df054b8a649b8be92a0a8b058384dae35bad142f9a610896eb6958"
          archive = urllib.request.urlopen(url, timeout=60).read()
          assert hashlib.sha256(archive).hexdigest() == archive_sha
          Path("horde-book.zip").write_bytes(archive)
          with zipfile.ZipFile("horde-book.zip") as container:
              assert container.namelist() == ["HORDE_openings.epd"]
              payload = container.read("HORDE_openings.epd")
          assert hashlib.sha256(payload).hexdigest() == payload_sha
          Path("horde-book").mkdir()
          Path("horde-book/HORDE_openings.epd").write_bytes(payload)
          PY
      - name: Build and verify Horde-Stockfish
        run: |
          make -j2 -C src ARCH=${{ matrix.arch }} build
          python3 tests/horde_rules.py src/stockfish
          python3 tests/horde_network_contract.py src/stockfish
          python3 tests/horde_bench.py src/stockfish --runs 1
          python3 tests/horde_genfens.py src/stockfish --book horde-book/HORDE_openings.epd
          file src/stockfish | grep 'statically linked'
      - name: Stage the sole executable
        run: |
          mkdir artifact
          install -m 0755 src/stockfish artifact/horde-stockfish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: horde-stockfish-linux-${{ matrix.simd }}-${{ matrix.bitops }}-play
          path: artifact/horde-stockfish
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: horde-stockfish-linux-${{ matrix.simd }}-${{ matrix.bitops }}-datagen
          path: artifact/horde-stockfish
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.simd }} ${{ matrix.bitops }} private artifacts
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64-bmi2
            simd: avx2
            bitops: pext
          - arch: x86-64-avx2
            simd: avx2
            bitops: popcnt
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
      - name: Fetch the pinned Horde opening book
        shell: msys2 {0}
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import urllib.request
          import zipfile

          url = "https://raw.githubusercontent.com/Belzedar94/OpenBench/cd0560081f6433b58a8aa8d0c3fd4a91e969f1dd/Books/HORDE_openings.epd.zip"
          archive_sha = "556b8bd549dc22797238268f9737c6a1f074a82f4cae2f4d62005ffbac6ccd18"
          payload_sha = "93e97b27d5df054b8a649b8be92a0a8b058384dae35bad142f9a610896eb6958"
          archive = urllib.request.urlopen(url, timeout=60).read()
          assert hashlib.sha256(archive).hexdigest() == archive_sha
          Path("horde-book.zip").write_bytes(archive)
          with zipfile.ZipFile("horde-book.zip") as container:
              assert container.namelist() == ["HORDE_openings.epd"]
              payload = container.read("HORDE_openings.epd")
          assert hashlib.sha256(payload).hexdigest() == payload_sha
          Path("horde-book").mkdir()
          Path("horde-book/HORDE_openings.epd").write_bytes(payload)
          PY
      - name: Build and verify Horde-Stockfish
        shell: msys2 {0}
        run: |
          make -j2 -C src ARCH=${{ matrix.arch }} build
          python tests/horde_rules.py src/stockfish.exe
          python tests/horde_network_contract.py src/stockfish.exe
          python tests/horde_bench.py src/stockfish.exe --runs 1
          python tests/horde_genfens.py src/stockfish.exe --book horde-book/HORDE_openings.epd
      - name: Stage the sole executable
        shell: msys2 {0}
        run: |
          mkdir artifact
          install -m 0755 src/stockfish.exe artifact/horde-stockfish.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: horde-stockfish-windows-${{ matrix.simd }}-${{ matrix.bitops }}-play
          path: artifact/horde-stockfish.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: horde-stockfish-windows-${{ matrix.simd }}-${{ matrix.bitops }}-datagen
          path: artifact/horde-stockfish.exe
          if-no-files-found: error
