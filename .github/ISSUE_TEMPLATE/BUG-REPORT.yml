name: Report a Horde-Stockfish issue
description: Report a reproducible rule, network, protocol, crash, or packaging defect
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Horde-Stockfish issue. A move preference by itself is not a correctness defect; strength changes are measured through the project's OpenBench workflow.

        Do not include credentials, private network URLs, access tokens, or non-public engine artifacts.

  - type: textarea
    attributes:
      label: Problem description
      description: Describe what happened and why it is incorrect for Lichess Horde.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Reproduction transcript
      description: Include the complete UCI command sequence and engine output.
      placeholder: |
        ```text
        uci
        setoption name Threads value 1
        setoption name Hash value 128
        position fen <complete Horde FEN>
        go depth 8
        ```
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behavior
      description: Include the expected legal moves, result, score, or packaging behavior.
    validations:
      required: true

  - type: input
    attributes:
      label: Horde-Stockfish commit and build
      description: Provide the full commit when possible and the binary architecture, such as x86-64-avx2 or x86-64-bmi2.
      placeholder: f60a7c63e3a713127d1953cf9484f186bb01250e / x86-64-bmi2
    validations:
      required: true

  - type: input
    attributes:
      label: Network identity
      description: Provide the EvalFile name and full SHA-256.
      placeholder: Horde_v1.nnue / B71108587968AC544EB2E62C2333FECA880DA5ACA52866787F1402163444ADF7
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Issue category
      options:
        - Horde rules or legal moves
        - Terminal result or material adjudication
        - NNUE loading or evaluation
        - UCI protocol
        - Crash, assertion, or hang
        - Build or release package
        - Performance regression
        - Other
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: textarea
    attributes:
      label: System and additional evidence
      description: Provide the CPU model, compiler or package source, GUI configuration, PGN, logs, and any other useful context.
    validations:
      required: false
