name: Horde release candidate

# Manual, artifact-only release engineering. This workflow never creates or
# moves a tag and never creates, edits or publishes a GitHub release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version in X.Y.Z form
        required: true
        type: string
      source_ref:
        description: Branch, tag or full commit to resolve once
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: horde-release-candidate-${{ inputs.version }}
  cancel-in-progress: false

env:
  LINUX_NATIVE_IMAGE: gcc:14.2.0-bookworm@sha256:b99b86a28812b1e6453a231a947dc43d76fe192788a12f344a9b568bf9f5d24c
  LINUX_NATIVE_AMD64_MANIFEST: sha256:82549aa8f90ada3236a8be70c74543132a76662ef33f0c3271ed802b81584a82
  WINDOWS_NATIVE_IMAGE: dockcross/windows-static-x64@sha256:e5fde458b54dda21d0265516f0310bc017532dd6f4fdad0b7239dc6ccd0f8ca9

jobs:
  validate:
    name: Resolve and validate candidate
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      epoch: ${{ steps.identity.outputs.epoch }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - id: identity
        name: Freeze source identity
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit=$(git rev-parse HEAD)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          epoch=$(git show -s --format=%ct HEAD)
          [[ "$epoch" =~ ^[0-9]+$ ]]
          git diff --quiet
          git diff --cached --quiet
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "version=$CANDIDATE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Authenticate frozen Horde inputs
        run: python3 scripts/horde/verify_baseline.py
      - name: Verify release contract tooling
        run: |
          python3 tests/horde_release_contract.py
          python3 -m py_compile \
            scripts/horde/release_manifest.py \
            scripts/horde/release_provenance.py \
            tests/horde_release_contract.py
          bash -n scripts/horde/build_native_release.sh

  native-linux:
    name: Linux ${{ matrix.arch }}
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86-64-avx2, x86-64-bmi2]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - id: toolchain
        name: Verify immutable Linux toolchain
        shell: bash
        run: |
          set -euo pipefail
          docker manifest inspect "$LINUX_NATIVE_IMAGE" > linux-image-manifest.json
          jq -e --arg digest "$LINUX_NATIVE_AMD64_MANIFEST" '
            [.manifests[] |
              select(.platform.os == "linux" and .platform.architecture == "amd64") |
              .digest] == [$digest]
          ' linux-image-manifest.json
          docker pull --platform linux/amd64 "$LINUX_NATIVE_IMAGE"
          docker image inspect \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            "$LINUX_NATIVE_IMAGE" |
            grep -Fqx 'gcc@sha256:b99b86a28812b1e6453a231a947dc43d76fe192788a12f344a9b568bf9f5d24c'
          description=$(docker run --rm --platform linux/amd64 \
            "$LINUX_NATIVE_IMAGE" sh -ceu '
              test "$(g++ -dumpfullversion)" = 14.2.0
              test "$(g++ -dumpmachine)" = x86_64-linux-gnu
              g++ --version | head -n 1
              tar --version | head -n 1
              xz --version | head -n 1
            ')
          {
            echo 'description<<EOF'
            echo "image=$LINUX_NATIVE_IMAGE"
            echo "platformManifest=$LINUX_NATIVE_AMD64_MANIFEST"
            echo "$description"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build and package twice
        shell: bash
        env:
          COMMIT: ${{ needs.validate.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          for build_id in a b; do
            root="build/native-linux-$build_id"
            mkdir -p "$root"
            git archive "$COMMIT" | tar -x -C "$root"
            docker run --rm --platform linux/amd64 \
              --env "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
              --volume "$GITHUB_WORKSPACE/$root:/work" \
              --workdir /work "$LINUX_NATIVE_IMAGE" \
              bash scripts/horde/build_native_release.sh \
                linux '${{ matrix.arch }}' "$RELEASE_VERSION" \
                "$SOURCE_DATE_EPOCH" "$COMMIT"
          done
          cmp \
            build/native-linux-a/src/horde-stockfish \
            build/native-linux-b/src/horde-stockfish
          asset="Horde-Stockfish-${RELEASE_VERSION}-linux-${{ matrix.arch }}.tar.xz"
          cmp \
            "build/native-linux-a/build/release/$asset" \
            "build/native-linux-b/build/release/$asset"
          mkdir -p build/release
          cp "build/native-linux-a/build/release/$asset" build/release/
      - name: Isolated Horde benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/embedcheck
          cp build/native-linux-a/src/horde-stockfish build/embedcheck/
          test -z "$(find build/embedcheck -name '*.nnue' -print -quit)"
          python3 tests/horde_bench.py build/embedcheck/horde-stockfish --runs 1
      - name: Write authenticated provenance
        shell: bash
        env:
          COMMIT: ${{ needs.validate.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TOOLCHAIN: ${{ steps.toolchain.outputs.description }}
        run: |
          set -euo pipefail
          asset="Horde-Stockfish-${RELEASE_VERSION}-linux-${{ matrix.arch }}.tar.xz"
          python3 scripts/horde/release_provenance.py \
            --asset "build/release/$asset" \
            --version "$RELEASE_VERSION" --commit "$COMMIT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --platform linux --architecture '${{ matrix.arch }}' \
            --toolchain "$TOOLCHAIN" -- \
            docker run --rm --platform linux/amd64 \
              --env "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
              --volume "$GITHUB_WORKSPACE/build/native-linux-a:/work" \
              --workdir /work "$LINUX_NATIVE_IMAGE" \
              bash scripts/horde/build_native_release.sh \
                linux '${{ matrix.arch }}' "$RELEASE_VERSION" \
                "$SOURCE_DATE_EPOCH" "$COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 14

  native-windows:
    name: Windows ${{ matrix.arch }}
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86-64-avx2, x86-64-bmi2]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - id: toolchain
        name: Verify immutable MinGW toolchain
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$WINDOWS_NATIVE_IMAGE"
          docker image inspect \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            "$WINDOWS_NATIVE_IMAGE" |
            grep -Fqx 'dockcross/windows-static-x64@sha256:e5fde458b54dda21d0265516f0310bc017532dd6f4fdad0b7239dc6ccd0f8ca9'
          description=$(docker run --rm --platform linux/amd64 \
            "$WINDOWS_NATIVE_IMAGE" sh -ceu '
              test -x "$CXX"
              test "$("$CXX" -dumpmachine)" = x86_64-w64-mingw32.static
              "$CXX" --version | head -n 1
              cmake --version | head -n 1
            ')
          {
            echo 'description<<EOF'
            echo "image=$WINDOWS_NATIVE_IMAGE"
            echo "$description"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build and package twice
        shell: bash
        env:
          COMMIT: ${{ needs.validate.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          for build_id in a b; do
            root="build/native-windows-$build_id"
            mkdir -p "$root"
            git archive "$COMMIT" | tar -x -C "$root"
            docker run --rm --platform linux/amd64 \
              --env "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
              --env "RELEASE_VERSION=$RELEASE_VERSION" \
              --env "COMMIT=$COMMIT" \
              --env 'ARCHITECTURE=${{ matrix.arch }}' \
              --volume "$GITHUB_WORKSPACE/$root:/work" \
              --workdir /work "$WINDOWS_NATIVE_IMAGE" sh -ceu '
                test -x "$CXX"
                bash scripts/horde/build_native_release.sh \
                  windows "$ARCHITECTURE" "$RELEASE_VERSION" \
                  "$SOURCE_DATE_EPOCH" "$COMMIT"
              '
          done
          cmp \
            build/native-windows-a/src/horde-stockfish.exe \
            build/native-windows-b/src/horde-stockfish.exe
          asset="Horde-Stockfish-${RELEASE_VERSION}-windows-${{ matrix.arch }}.zip"
          cmp \
            "build/native-windows-a/build/release/$asset" \
            "build/native-windows-b/build/release/$asset"
          mkdir -p build/release
          cp "build/native-windows-a/build/release/$asset" build/release/
      - name: Write authenticated provenance
        shell: bash
        env:
          COMMIT: ${{ needs.validate.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TOOLCHAIN: ${{ steps.toolchain.outputs.description }}
        run: |
          set -euo pipefail
          asset="Horde-Stockfish-${RELEASE_VERSION}-windows-${{ matrix.arch }}.zip"
          python3 scripts/horde/release_provenance.py \
            --asset "build/release/$asset" \
            --version "$RELEASE_VERSION" --commit "$COMMIT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --platform windows --architecture '${{ matrix.arch }}' \
            --toolchain "$TOOLCHAIN" -- \
            docker run --rm --platform linux/amd64 \
              --env "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
              --volume "$GITHUB_WORKSPACE/build/native-windows-a:/work" \
              --workdir /work "$WINDOWS_NATIVE_IMAGE" \
              bash scripts/horde/build_native_release.sh \
                windows '${{ matrix.arch }}' "$RELEASE_VERSION" \
                "$SOURCE_DATE_EPOCH" "$COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-${{ matrix.arch }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 14

  native-windows-smoke:
    name: Windows archive smoke
    needs: [validate, native-windows]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-windows-*
          path: build/release-input
      - name: Run each packaged executable without a companion network
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = @(Get-ChildItem build/release-input -Recurse -File -Filter '*.zip')
          if ($archives.Count -ne 2) { throw "Expected two Windows archives, got $($archives.Count)" }
          foreach ($archive in $archives) {
            $extract = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileNameWithoutExtension($archive.Name))
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extract
            $engines = @(Get-ChildItem $extract -Recurse -File -Filter 'horde-stockfish.exe')
            if ($engines.Count -ne 1) { throw "Expected one engine in $($archive.Name)" }
            $isolated = Join-Path $env:RUNNER_TEMP ("isolated-" + [guid]::NewGuid())
            New-Item -ItemType Directory -Path $isolated | Out-Null
            $engine = Join-Path $isolated 'horde-stockfish.exe'
            Copy-Item -LiteralPath $engines[0].FullName -Destination $engine
            if (Get-ChildItem $isolated -Recurse -File -Filter '*.nnue') {
              throw 'Isolated runtime unexpectedly contains an NNUE file'
            }
            python tests/horde_bench.py $engine --runs 1
          }

  assemble:
    name: Authenticate and assemble candidate
    needs: [validate, native-linux, native-windows, native-windows-smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: build/release-input
      - name: Assemble and verify every byte
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/horde/release_manifest.py \
            --input-root build/release-input \
            --output-dir build/release-final \
            --version '${{ needs.validate.outputs.version }}' \
            --commit '${{ needs.validate.outputs.commit }}' \
            --source-date-epoch '${{ needs.validate.outputs.epoch }}'
          (cd build/release-final && sha256sum --check --strict SHA256SUMS)
          test "$(find build/release-final -maxdepth 1 -type f | wc -l)" -eq 6
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Horde-Stockfish-${{ needs.validate.outputs.version }}-release
          path: build/release-final/*
          if-no-files-found: error
          retention-days: 30
