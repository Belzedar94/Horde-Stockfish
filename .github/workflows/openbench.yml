name: OpenBench

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: 1786036843

jobs:
  linux-play:
    name: Linux ${{ matrix.simd }} ${{ matrix.bitops }} play
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64-bmi2
            simd: avx2
            bitops: pext
          - arch: x86-64-avx2
            simd: avx2
            bitops: popcnt
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build and verify the baseline
        run: |
          make -C src -j2 build ARCH=${{ matrix.arch }} COMP=gcc EXTRALDFLAGS=-static
          python3 tests/hordetest_baseline.py src/stockfish --variant-path hordetest.ini
          file src/stockfish | grep 'statically linked'
      - name: Stage the sole executable
        run: |
          mkdir artifact
          install -m 0755 src/stockfish artifact/fsf-hordetest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fsf-hordetest-linux-${{ matrix.simd }}-${{ matrix.bitops }}-play
          path: artifact/fsf-hordetest
          if-no-files-found: error

  windows-play:
    name: Windows ${{ matrix.simd }} ${{ matrix.bitops }} play
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64-bmi2
            simd: avx2
            bitops: pext
          - arch: x86-64-avx2
            simd: avx2
            bitops: popcnt
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
      - name: Build and verify the baseline
        shell: msys2 {0}
        run: |
          make -C src -j2 build ARCH=${{ matrix.arch }} COMP=mingw \
            EXTRALDFLAGS=-Wl,--no-insert-timestamp
          python tests/hordetest_baseline.py src/stockfish.exe --variant-path hordetest.ini
      - name: Stage the sole executable
        shell: msys2 {0}
        run: |
          mkdir artifact
          install -m 0755 src/stockfish.exe artifact/fsf-hordetest.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fsf-hordetest-windows-${{ matrix.simd }}-${{ matrix.bitops }}-play
          path: artifact/fsf-hordetest.exe
          if-no-files-found: error
